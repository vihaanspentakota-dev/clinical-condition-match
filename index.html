<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>The Symptom Solver</h1>

        <p>Enter your symptoms:</p>

        <input
            type="text"
            id="symptomInput"
            placeholder="e.g. headache, cough, sore throat"
        >

        <button id="checkButton">Check Symptoms</button>

        <section id="results">
            <h2>Possible Conditions:</h2>

            <div id="resultsList"></div>
        </section>
    </main>

    <footer>
        <p>This is for education purposes only. This is a project and does not give a diagnosis.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
